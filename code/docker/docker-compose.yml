version: '3.8'
services:
  db:
    image: mysql:8
    environment:
      MYSQL_DATABASE: kriterion
      MYSQL_ROOT_PASSWORD: changeme
    volumes:
      - db_data:/var/lib/mysql

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    ports:
      - '8080:8080'
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/kriterion
      - JWT_SECRET=Kriterion_2026_Secure_JWT_Secret_Key_For_HS256_Auth_System
    depends_on:
      - db

  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/Dockerfile.frontend
    ports:
      - '5173:5173'
    volumes:
      - ../frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  db_data:
