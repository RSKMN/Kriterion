version: '3.8'
services:
  db:
    image: mysql:8
    environment:
      MYSQL_DATABASE: kriterion
      MYSQL_ROOT_PASSWORD: changeme
    volumes:
      - db_data:/var/lib/mysql

  backend:
    build: ../backend/docker
    ports:
      - '8080:8080'
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/kriterion
    depends_on:
      - db

  frontend:
    build: ../frontend
    ports:
      - '5173:5173'
    depends_on:
      - backend

volumes:
  db_data:
