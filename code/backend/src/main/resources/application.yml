spring:
  profiles:
    active: dev
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/kriterion}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:changeme}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    clean-disabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  servlet:
    context-path: /api/v1
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production}
    access-token-expiration-minutes: 60
    refresh-token-expiration-days: 30

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.kriterion: DEBUG
