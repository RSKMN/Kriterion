<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      body {
        font-family:
          'Inter',
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
        line-height: 1.6;
        color: #334155;
        margin: 0;
        padding: 0;
        background-color: #f8fafc;
      }
      .container {
        max-width: 600px;
        margin: 40px auto;
        background: #ffffff;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
      }
      .header {
        background: #0f172a;
        padding: 32px;
        text-align: center;
      }
      .header h1 {
        color: #f8fafc;
        margin: 0;
        font-size: 24px;
        font-weight: 700;
        letter-spacing: -0.025em;
      }
      .content {
        padding: 40px;
      }
      .footer {
        background: #f1f5f9;
        padding: 24px;
        text-align: center;
        color: #64748b;
        font-size: 12px;
      }
      .btn {
        display: inline-block;
        padding: 12px 24px;
        background-color: #3b82f6;
        color: #ffffff;
        text-decoration: none;
        border-radius: 6px;
        font-weight: 600;
        margin-top: 24px;
      }
      .badge {
        display: inline-block;
        padding: 4px 12px;
        border-radius: 9999px;
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
      }
      .badge-warning {
        background-color: #fef3c7;
        color: #92400e;
      }
      .badge-critical {
        background-color: #fee2e2;
        color: #991b1b;
      }
      .badge-info {
        background-color: #e0f2fe;
        color: #075985;
      }
      hr {
        border: 0;
        border-top: 1px solid #e2e8f0;
        margin: 24px 0;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>KRITERION</h1>
      </div>
      <div class="content">
        <div th:replace="${content}"></div>
      </div>
      <div class="footer">
        <p>&copy; 2026 Kriterion. All rights reserved.</p>
        <p>
          You received this email because you have notifications enabled in your account settings.
        </p>
      </div>
    </div>
  </body>
</html>
